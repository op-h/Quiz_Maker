name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase Config
        env:
          FB_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FB_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FB_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FB_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FB_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FB_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FB_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        # Secrets are passed as DATA to node and JSON-encoded — never interpolated by the shell —
        # so a value containing backticks / $( ) / " / \ cannot inject commands or corrupt the file.
        run: |
          node -e '
            const fs = require("fs");
            const cfg = {
              apiKey: process.env.FB_API_KEY,
              authDomain: process.env.FB_AUTH_DOMAIN,
              projectId: process.env.FB_PROJECT_ID,
              databaseURL: process.env.FB_DATABASE_URL,
              storageBucket: process.env.FB_STORAGE_BUCKET,
              messagingSenderId: process.env.FB_MESSAGING_SENDER_ID,
              appId: process.env.FB_APP_ID
            };
            const out =
              "const FIREBASE_CONFIG = " + JSON.stringify(cfg, null, 2) + ";\n" +
              "if (typeof firebase !== \"undefined\" && firebase.apps.length === 0) {\n" +
              "  try { firebase.initializeApp(FIREBASE_CONFIG); }\n" +
              "  catch (e) { console.error(\"Firebase init error:\", e); }\n" +
              "}\n";
            fs.writeFileSync("js/firebase-config.js", out);
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
